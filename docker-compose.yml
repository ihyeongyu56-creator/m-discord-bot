services:
  discord-bot:
    build: .
    container_name: m-discord-bot
    restart: always
    env_file:
      - .env
    environment:
      PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8080/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
